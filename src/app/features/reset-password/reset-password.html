<div class="auth-container">
  <div class="auth-card">

    <div class="auth-logo">
      <svg class="auth-logo-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="mobde3LogoGradReset" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="50%" stop-color="#7c3aed"/>
            <stop offset="100%" stop-color="#0284c7"/>
          </linearGradient>
        </defs>
        <path d="M20 2L35 10.5V29.5L20 38L5 29.5V10.5L20 2Z" fill="url(#mobde3LogoGradReset)"/>
        <path d="M20 5.5L32 12V28L20 34.5L8 28V12L20 5.5Z" fill="#ffffff" opacity="0.2"/>
        <path d="M11 27V13L20 21L29 13V27" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="20" cy="21" r="1.8" fill="#38bdf8"/>
      </svg>
      <p class="auth-brand-name">Mobde3</p>
    </div>

    <!-- Succès -->
    <ng-container *ngIf="success">
      <div class="success-state">
        <div class="success-icon">✅</div>
        <h2>Mot de passe mis à jour !</h2>
        <p class="auth-subtitle">Votre mot de passe a été réinitialisé avec succès.</p>
        <p class="success">Redirection vers la connexion dans 3 secondes...</p>
      </div>
    </ng-container>

    <!-- Formulaire -->
    <ng-container *ngIf="!success">
      <h2>Nouveau mot de passe 🔒</h2>
      <p class="auth-subtitle">Choisissez un mot de passe sécurisé pour votre compte</p>

      <!-- Champ mot de passe -->
      <div class="input-wrapper">
        <input
          id="reset-password-input"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="newPassword"
          placeholder="Nouveau mot de passe"
          autocomplete="new-password"
        />
        <button type="button" class="toggle-pw" (click)="showPassword = !showPassword" tabindex="-1">
          {{ showPassword ? '🙈' : '👁️' }}
        </button>
      </div>

      <!-- Indicateur de force -->
      <div class="strength-bar" *ngIf="newPassword">
        <div class="strength-bar__track">
          <div
            class="strength-bar__fill"
            [style.width.%]="passwordStrength.level * 20"
            [style.background]="passwordStrength.color"
          ></div>
        </div>
        <span class="strength-bar__label" [style.color]="passwordStrength.color">
          {{ passwordStrength.label }}
        </span>
      </div>

      <!-- Confirmation -->
      <input
        id="reset-confirm-input"
        [type]="showPassword ? 'text' : 'password'"
        [(ngModel)]="confirmPassword"
        placeholder="Confirmer le mot de passe"
        autocomplete="new-password"
        (keyup.enter)="onSubmit()"
      />

      <p class="error"   *ngIf="error">{{ error }}</p>

      <button id="reset-submit-btn" (click)="onSubmit()" [disabled]="loading || !token">
        <span *ngIf="!loading">Réinitialiser le mot de passe</span>
        <span *ngIf="loading" class="btn-loading">
          <span class="spinner"></span>
          Enregistrement...
        </span>
      </button>
    </ng-container>

    <p class="switch-link" style="margin-top:1.25rem">
      <a routerLink="/login">← Retour à la connexion</a>
    </p>

  </div>
</div>
