<div class="auth-container">
  <div class="auth-card">

    <div class="auth-logo">
      <svg class="auth-logo-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="mobde3LogoGradForgot" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="50%" stop-color="#7c3aed"/>
            <stop offset="100%" stop-color="#0284c7"/>
          </linearGradient>
        </defs>
        <path d="M20 2L35 10.5V29.5L20 38L5 29.5V10.5L20 2Z" fill="url(#mobde3LogoGradForgot)"/>
        <path d="M20 5.5L32 12V28L20 34.5L8 28V12L20 5.5Z" fill="#ffffff" opacity="0.2"/>
        <path d="M11 27V13L20 21L29 13V27" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="20" cy="21" r="1.8" fill="#38bdf8"/>
      </svg>
      <p class="auth-brand-name">Mobde3</p>
    </div>

    <!-- État : formulaire -->
    <ng-container *ngIf="!submitted">
      <h2>Mot de passe oublié 🔑</h2>
      <p class="auth-subtitle">Entrez votre email pour recevoir un lien de réinitialisation</p>

      <input
        id="forgot-email"
        type="email"
        [(ngModel)]="email"
        placeholder="Adresse email"
        autocomplete="email"
        (keyup.enter)="onSubmit()"
      />

      <p class="error" *ngIf="error">{{ error }}</p>

      <button id="forgot-submit-btn" (click)="onSubmit()" [disabled]="loading">
        <span *ngIf="!loading">Envoyer le lien de réinitialisation</span>
        <span *ngIf="loading" class="btn-loading">
          <span class="spinner"></span>
          Envoi en cours...
        </span>
      </button>
    </ng-container>

    <!-- État : succès -->
    <ng-container *ngIf="submitted">
      <div class="success-state">
        <div class="success-icon">📧</div>
        <h2>Email envoyé !</h2>
        <p class="auth-subtitle">
          Si l'adresse <strong>{{ email }}</strong> correspond à un compte, vous recevrez un lien de réinitialisation sous peu.
        </p>
        <p class="success">Vérifiez votre boîte de réception et vos spams.</p>
      </div>
    </ng-container>

    <p class="switch-link" style="margin-top:1.25rem">
      <a routerLink="/login">← Retour à la connexion</a>
    </p>

  </div>
</div>
